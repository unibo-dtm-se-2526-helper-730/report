<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 760 500" width="760" height="500" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker></defs>
<rect y="20" width="760" height="500" fill="white"/>

<!-- imperative shell -->
<circle cx="380" cy="280" r="225" fill="#fafafa" stroke="#999999" stroke-width="1.5"/>
<text x="380" y="98" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Imperative shell</text>
<text x="380" y="117" text-anchor="middle" font-size="12" fill="#444">I/O, side effects, frameworks</text>

<!-- functional core -->
<circle cx="380" cy="280" r="105" fill="#e3ecee" stroke="#335c67" stroke-width="2"/>
<text x="380" y="258" text-anchor="middle" font-size="16" font-weight="bold" fill="#335c67">Functional core</text>
<text x="380" y="282" text-anchor="middle" font-size="14" fill="#222">engine · domain</text>
<text x="380" y="304" text-anchor="middle" font-size="12" fill="#444">pure calculations,</text>
<text x="380" y="320" text-anchor="middle" font-size="12" fill="#444">plain Java</text>

<!-- shell packages -->
<g font-size="12" fill="#222" text-anchor="middle">
  <rect x="179" y="211" width="92" height="26" rx="13" fill="#eeeeee" stroke="#999"/><text x="225" y="228">api</text>
  <rect x="179" y="323" width="92" height="26" rx="13" fill="#eeeeee" stroke="#999"/><text x="225" y="340">ingestion</text>
  <rect x="252" y="410" width="92" height="26" rx="13" fill="#eeeeee" stroke="#999"/><text x="298" y="427">i18n</text>
  <rect x="416" y="410" width="92" height="26" rx="13" fill="#eeeeee" stroke="#999"/><text x="462" y="427">reporting</text>
  <rect x="489" y="323" width="92" height="26" rx="13" fill="#eeeeee" stroke="#999"/><text x="535" y="340">service</text>
  <rect x="489" y="211" width="92" height="26" rx="13" fill="#eeeeee" stroke="#999"/><text x="535" y="228">persistence</text>
</g>

<!-- outside world -->
<rect x="15" y="205" width="100" height="38" rx="4" fill="#eeeeee" stroke="#999"/>
<text x="65" y="228" text-anchor="middle" font-size="13" fill="#222">Browser</text>
<line x1="115" y1="224" x2="177" y2="224" stroke="#555" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="146" y="214" text-anchor="middle" font-size="11" fill="#555">HTTP</text>

<rect x="15" y="317" width="100" height="38" rx="4" fill="#eeeeee" stroke="#999"/>
<text x="65" y="340" text-anchor="middle" font-size="13" fill="#222">Broker CSV</text>
<line x1="115" y1="336" x2="177" y2="336" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

<rect x="645" y="205" width="100" height="38" rx="4" fill="#eeeeee" stroke="#999"/>
<text x="695" y="228" text-anchor="middle" font-size="13" fill="#222">PostgreSQL</text>
<line x1="583" y1="224" x2="643" y2="224" stroke="#555" stroke-width="1.2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="613" y="214" text-anchor="middle" font-size="11" fill="#555">SQL</text>

</svg>
